<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e6ff"/>
      <stop offset="100%" stop-color="#e8d5f5"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#1a0f30"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="200"/>
  <!-- Hair -->
  <ellipse cx="200" cy="155" rx="85" ry="95" fill="url(#hair)"/>
  <!-- Face -->
  <ellipse cx="200" cy="190" rx="62" ry="70" fill="#f5d0a9"/>
  <!-- Eyes -->
  <ellipse cx="178" cy="185" rx="6" ry="5" fill="#2d1b4e"/>
  <ellipse cx="222" cy="185" rx="6" ry="5" fill="#2d1b4e"/>
  <circle cx="178" cy="184" r="2" fill="white"/>
  <circle cx="222" cy="184" r="2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M168 172 Q178 168 188 172" stroke="#2d1b4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M212 172 Q222 168 232 172" stroke="#2d1b4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M197 195 Q200 202 203 195" stroke="#d4a574" stroke-width="1.5" fill="none"/>
  <!-- Smile -->
  <path d="M185 215 Q200 225 215 215" stroke="#c47a5a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Hair strands -->
  <path d="M140 140 Q150 100 200 85 Q250 100 260 140" fill="url(#hair)"/>
  <path d="M135 160 Q130 130 145 105" stroke="#1a0f30" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Lab coat -->
  <path d="M130 280 Q140 260 200 255 Q260 260 270 280 L280 400 L120 400 Z" fill="white"/>
  <path d="M175 255 L180 290 L200 295 L220 290 L225 255" fill="white" stroke="#e8e8e8" stroke-width="1"/>
  <!-- Stethoscope hint -->
  <path d="M190 290 Q185 310 195 320" stroke="#7A3E9D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="195" cy="322" r="5" fill="#7A3E9D"/>
</svg>