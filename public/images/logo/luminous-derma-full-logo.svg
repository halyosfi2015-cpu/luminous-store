<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <defs>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#322144"/>
      <stop offset="50%" stop-color="#4A306F"/>
      <stop offset="100%" stop-color="#6B3FA0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F7D98C"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F7D98C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F7D98C"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F7D98C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="dermaGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F7D98C"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#322144"/>
      <stop offset="35%" stop-color="#4A306F"/>
      <stop offset="60%" stop-color="#B87FB0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- ===== MARK (left side, 0-140) ===== -->
  <g transform="translate(0, 35)">
    <!-- Broken gold ring -->
    <path
      d="M35 5 C45.5 5 53.25 12.75 53.25 23.25 C53.25 33.75 45.5 41.5 35 41.5 C24.5 41.5 16.75 33.75 16.75 23.25 C16.75 12.75 24.5 5 35 5"
      stroke="url(#ringGrad)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M16.75 23.25 C16.75 12.75 24.5 5 35 5"
      stroke="url(#ringGrad)"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
      opacity="0.25"
    />

    <!-- Female profile silhouette -->
    <path
      d="M27 15
         C30 15 33 16.5 34 18.5
         C36 22.5 36 27.5 33 30.5
         C29.5 33.5 24 35 20 34
         C17 33 15 30 14 26
         C13 22 14 17 16.5 14
         C19 11 23 11 27 15 Z"
      fill="url(#hairGrad)"
    />

    <!-- Hair flowing back -->
    <path
      d="M30 16
         C33.5 15 37 16 39 19
         C41.5 23 42.5 28 40 32
         C38 36 34 38 30 37
         C26 36 23 33 21 29
         C19 25 19 20 21.5 17
         C24 14 26 13 30 16 Z"
      fill="url(#hairGrad)"
      opacity="0.7"
    />

    <!-- Hair sweeping down to dewdrop -->
    <path
      d="M19 34
         C18 37 16 40 14 42
         C12 44 9 45 7 44
         C5 43 4 40.5 5 39
         C6 37.5 7.5 36 10 35.5
         C12.5 35 15.5 36 19 34 Z"
      fill="url(#hairGrad)"
      opacity="0.85"
    />

    <!-- Golden dewdrop -->
    <ellipse cx="6" cy="39" rx="2.25" ry="2.75" fill="url(#dropGrad)"/>
    <ellipse cx="5.5" cy="38" rx="0.75" ry="1" fill="#FFF7F2" opacity="0.6"/>

    <!-- Four-point sparkle -->
    <g fill="url(#sparkleGrad)">
      <path d="M35 9 L35.5 10.5 L37 10.5 L35.75 11.5 L36.25 13 L35 12 L33.75 13 L34.25 11.5 L33 10.5 L34.5 10.5 Z" transform="scale(0.5)"/>
    </g>
    <g fill="url(#sparkleGrad)" opacity="0.8">
      <path d="M35 9 L35.5 10.5 L37 10.5 L35.75 11.5 L36.25 13 L35 12 L33.75 13 L34.25 11.5 L33 10.5 L34.5 10.5 Z" transform="translate(2,-1.5) scale(0.35)"/>
    </g>
    <g fill="url(#sparkleGrad)" opacity="0.6">
      <path d="M35 9 L35.5 10.5 L37 10.5 L35.75 11.5 L36.25 13 L35 12 L33.75 13 L34.25 11.5 L33 10.5 L34.5 10.5 Z" transform="translate(-1.5,1) scale(0.25)"/>
    </g>
    <g fill="url(#sparkleGrad)" opacity="0.5">
      <path d="M35 9 L35.5 10.5 L37 10.5 L35.75 11.5 L36.25 13 L35 12 L33.75 13 L34.25 11.5 L33 10.5 L34.5 10.5 Z" transform="translate(3,2) scale(0.2)"/>
    </g>

    <!-- Gold leaf sprig -->
    <g fill="url(#leafGrad)" transform="translate(9,48)">
      <path d="M0 0 Q-2 -4 -1 -7 Q0 -9 1 -7 Q3 -4 0 0 Z"/>
      <path d="M0 0 Q1.5 -3 0.5 -5 Q-0.5 -7 -1.5 -5 Q-2.5 -3 0 0 Z" transform="translate(2,-1) scale(0.7) rotate(-20)"/>
      <path d="M0 0 Q1.5 -3 0.5 -5 Q-0.5 -7 -1.5 -5 Q-2.5 -3 0 0 Z" transform="translate(-1,-3) scale(0.55) rotate(25)"/>
    </g>
  </g>

  <!-- ===== WORDMARK (right side, starting at x=150) ===== -->
  <g transform="translate(150, 0)">
    <!-- "Luminous" - serif, purple→gold gradient -->
    <text
      x="0"
      y="85"
      font-family="'Playfair Display', Georgia, serif"
      font-weight="700"
      font-size="62"
      fill="url(#wordGrad)"
      letter-spacing="-0.02em"
    >
      Luminous
    </text>

    <!-- "DERMA" - Montserrat, gold, flanked by hairlines -->
    <g>
      <line x1="-4" y1="104" x2="0" y2="104" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="108" x2="0" y2="108" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
      <text
        x="0"
        y="114"
        font-family="'Montserrat', Arial, sans-serif"
        font-weight="600"
        font-size="18"
        fill="url(#dermaGrad)"
        letter-spacing="0.3em"
        text-transform="uppercase"
      >
        DERMA
      </text>
      <line x1="76" y1="104" x2="80" y2="104" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="76" y1="108" x2="80" y2="108" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>