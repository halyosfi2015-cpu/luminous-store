<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#322144"/>
      <stop offset="50%" stop-color="#4A306F"/>
      <stop offset="100%" stop-color="#6B3FA0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F7D98C"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F7D98C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F7D98C"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F7D98C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Broken gold ring -->
  <path
    d="M64 12 C86 12 104 28 104 48 C104 68 86 84 64 84 C42 84 24 68 24 48 C24 28 42 12 64 12"
    stroke="url(#ringGrad)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M24 48 C24 28 42 12 64 12"
    stroke="url(#ringGrad)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.25"
  />

  <!-- Female profile silhouette with flowing hair -->
  <path
    d="M54 28
       C60 28 66 31 68 37
       C72 46 72 56 66 62
       C59 69 48 72 40 70
       C34 68 30 62 28 54
       C26 46 28 36 34 30
       C40 24 48 24 54 28 Z"
    fill="url(#hairGrad)"
  />

  <!-- Hair flowing back -->
  <path
    d="M60 30
       C68 28 76 30 80 36
       C86 44 88 54 84 62
       C80 70 72 74 62 72
       C54 70 48 64 44 56
       C40 48 40 38 46 32
       C52 26 56 24 60 30 Z"
    fill="url(#hairGrad)"
    opacity="0.7"
  />

  <!-- Hair sweeping down to dewdrop -->
  <path
    d="M38 70
       C36 76 32 82 28 86
       C24 90 18 92 14 90
       C10 88 8 82 10 76
       C12 70 16 66 22 64
       C28 62 34 64 38 70 Z"
    fill="url(#hairGrad)"
    opacity="0.85"
  />

  <!-- Golden dewdrop -->
  <ellipse cx="12" cy="78" rx="4.5" ry="5.5" fill="url(#dropGrad)"/>
  <ellipse cx="11" cy="76" rx="1.5" ry="2" fill="#FFF7F2" opacity="0.6"/>

  <!-- Four-point sparkle -->
  <g fill="url(#sparkleGrad)">
    <path d="M70 18 L71 21 L74 21 L71.5 23 L72.5 26 L70 24 L67.5 26 L68.5 23 L66 21 L69 21 Z"/>
  </g>
  <g fill="url(#sparkleGrad)" opacity="0.8">
    <path d="M70 18 L71 21 L74 21 L71.5 23 L72.5 26 L70 24 L67.5 26 L68.5 23 L66 21 L69 21 Z" transform="translate(4,-3) scale(0.4)"/>
  </g>
  <g fill="url(#sparkleGrad)" opacity="0.6">
    <path d="M70 18 L71 21 L74 21 L71.5 23 L72.5 26 L70 24 L67.5 26 L68.5 23 L66 21 L69 21 Z" transform="translate(-3,2) scale(0.3)"/>
  </g>
  <g fill="url(#sparkleGrad)" opacity="0.5">
    <path d="M70 18 L71 21 L74 21 L71.5 23 L72.5 26 L70 24 L67.5 26 L68.5 23 L66 21 L69 21 Z" transform="translate(6,4) scale(0.25)"/>
  </g>

  <!-- Gold leaf sprig -->
  <g fill="url(#leafGrad)" transform="translate(18,90)">
    <path d="M0 0 Q-4 -8 -2 -14 Q0 -18 2 -14 Q6 -8 0 0 Z"/>
    <path d="M0 0 Q3 -6 1 -10 Q-1 -14 -3 -10 Q-5 -6 0 0 Z" transform="translate(4,-2) scale(0.7) rotate(-20)"/>
    <path d="M0 0 Q3 -6 1 -10 Q-1 -14 -3 -10 Q-5 -6 0 0 Z" transform="translate(-2,-6) scale(0.55) rotate(25)"/>
  </g>
</svg>