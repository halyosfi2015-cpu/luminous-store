:root{--p9:#3b0764;--p8:#581c87;--p7:#6b21a8;--g1:#e6c76e;--g2:#b8893a;--g3:#8a6420;--bg:#fbf8f3}
*{margin:0;box-sizing:border-box}html,body{background:var(--bg);width:100%;overflow-x:hidden}
#wrap{width:100vw;height:calc(100vw*600/2142);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#stage{position:absolute;left:0;top:0;width:2142px;height:600px;transform-origin:0 0;font-family:T,sans-serif;direction:rtl;background:#fbf8f3;overflow:hidden}
.abs{position:absolute}
.it,.bagw{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;z-index:4;filter:drop-shadow(0 14px 12px rgba(59,7,100,.28))}
.it img,.it svg,.bagw>img{display:block;height:100%;width:auto}
.bagw{z-index:3;left:872px;top:14px;width:226px;height:352px;opacity:1;transform-origin:50% 55%}
.bagw>img{width:226px;height:352px}.bagw .bl{position:absolute}
.it.ins{z-index:2}.bagw.go{z-index:7}
.badge{position:absolute;right:-12px;top:96px;min-width:40px;height:40px;border-radius:20px;background:linear-gradient(135deg,#3b0764,#6b21a8);border:2.5px solid #e6c76e;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;transition:transform .2s;opacity:0}
.badge.pop{transform:scale(1.4)}
.pill{position:absolute;left:905px;top:462px;display:flex;align-items:center;gap:8px;padding:5px 18px;border-radius:20px;background:#fff;border:1.5px solid rgba(184,137,58,.7);color:#581c87;font-size:20px;font-weight:700;box-shadow:0 4px 12px rgba(88,28,135,.15);z-index:1}
.mapw{position:absolute;left:86px;top:92px;width:370px;filter:drop-shadow(0 14px 18px rgba(88,28,135,.35)) drop-shadow(0 0 8px rgba(230,199,110,.8));animation:mf 7s ease-in-out infinite}
.mapw img{width:100%;display:block}
@keyframes mf{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(1deg)}}
.mapglow{animation:mf 7s ease-in-out infinite,mg 1.1s ease-out}
@keyframes mg{40%{filter:drop-shadow(0 14px 18px rgba(88,28,135,.35)) drop-shadow(0 0 38px rgba(230,199,110,1))}}
.home{position:absolute;animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.chk{position:absolute;right:-4px;top:-4px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e6c76e,#b8893a);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.chk.on{transform:scale(1)}
.dash{stroke-dasharray:3 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
.fi{position:absolute;left:0;top:0;z-index:8;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(59,7,100,.3))}.fi svg{display:block;height:100%;width:auto}
.shine{position:absolute;top:0;bottom:0;width:260px;left:-300px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:sh 8s ease-in-out infinite 2s;z-index:9;pointer-events:none}@keyframes sh{0%{left:-300px}35%,100%{left:2300px}}
.txt{position:absolute;right:52px;top:44px;width:800px;text-align:right;z-index:5}.txt>*{opacity:0;animation:up .8s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

h2{white-space:nowrap;font-size:56px;font-weight:700;line-height:1.2;background:linear-gradient(90deg,var(--g3),var(--g1) 50%,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;animation-delay:.4s}
p.d{font-size:25px;color:#4a3a5c;line-height:1.85;margin-top:12px;animation-delay:.6s}

/* ============================ LOUZ SCENE SYSTEM ======================== */
.lz-routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.lz-routes path{fill:none;stroke:#fff;stroke-linecap:round;animation:lz-dash 1.1s linear infinite}
.lz-routes .src{stroke-width:2.4;stroke-dasharray:2 8;opacity:.75}
.lz-routes .r{stroke-width:2.2;stroke-dasharray:2 8;opacity:.8}
.lz-routes .hm{stroke-width:1.5;stroke-dasharray:1.5 6;opacity:.4;transition:opacity .4s}
.lz-routes .hm.on{opacity:.95}
.lz-comet{pointer-events:none}
@keyframes lz-dash{to{stroke-dashoffset:-10}}
.lz-el{position:absolute;left:0;top:0;transform:translate(-50%,-100%);transform-origin:50% 100%;
will-change:transform,opacity;user-select:none;-webkit-user-drag:none;pointer-events:none}
.lz-prod{z-index:5;filter:drop-shadow(0 5px 7px rgba(75,42,111,.30))}
#bag.bagw{position:absolute;left:863px;top:427px;width:194px;height:303px;
transform:translate(-50%,-100%);transform-origin:50% 100%;z-index:3;opacity:1;
filter:drop-shadow(0 10px 16px rgba(75,42,111,.35))}
#bag>img{width:100%;height:100%;object-fit:contain}
.lz-src{position:absolute;z-index:4;transform:translate(-50%,-50%);
display:flex;flex-direction:column;align-items:center;gap:3px;direction:rtl}
.lz-src-ic{background:#fff;border-radius:12px;display:grid;place-items:center;
box-shadow:0 6px 14px rgba(75,42,111,.25);border:1.5px solid rgba(184,137,58,.45)}
.lz-src-ic svg{width:56%;height:56%;fill:none;stroke:#581c87;stroke-width:1.9;
stroke-linecap:round;stroke-linejoin:round}
.lz-src-lb{background:#fff;color:#581c87;font-weight:700;font-size:13px;line-height:1;
padding:5px 10px;border-radius:999px;white-space:nowrap;
box-shadow:0 4px 10px rgba(75,42,111,.18);border:1.5px solid rgba(184,137,58,.5)}
.lz-house{position:absolute;z-index:4;left:0;top:0;transform:translate(-50%,-50%);
background:#fff;border-radius:30%;display:grid;place-items:center;
box-shadow:0 6px 14px rgba(75,42,111,.25);border:1.5px solid rgba(184,137,58,.45)}
.lz-house>svg{width:58%;height:58%;fill:none;stroke:#581c87;stroke-width:1.9;
stroke-linecap:round;stroke-linejoin:round}
.lz-house .lz-check{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;
background:linear-gradient(135deg,#e6c76e,#b8893a);display:grid;place-items:center;
border:2px solid #fff;opacity:0;transform:scale(.3);
transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.lz-house .lz-check svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3.4;
stroke-linecap:round;stroke-linejoin:round}
.lz-house.on .lz-check{opacity:1;transform:scale(1)}
.lz-map{position:absolute;z-index:2;overflow:visible;pointer-events:none;
filter:drop-shadow(0 6px 14px rgba(10,4,30,.45))}
.lz-map .land{fill:rgba(255,255,255,.28);stroke:#fff;stroke-width:1.6;stroke-linejoin:round;
vector-effect:non-scaling-stroke;transition:fill .6s ease}
.lz-map.on .land{fill:rgba(255,255,255,.96)}
.lz-map .spot{fill:#b8893a;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;
transform-box:fill-box;transform-origin:center;transform:scale(0);
transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.lz-map .spot.on{transform:scale(1)}
.lz-map .ring{fill:none;stroke:#b8893a;stroke-width:1.4;vector-effect:non-scaling-stroke;
transform-box:fill-box;transform-origin:center;opacity:0}
.lz-map .ring.on{animation:lz-ring2 .9s ease-out}
@keyframes lz-ring2{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.lz-map .city{opacity:0;transition:opacity .5s ease .1s}
.lz-map .city.on{opacity:1}
.lz-map .city line{stroke:#581c87;stroke-width:1.1;vector-effect:non-scaling-stroke;
stroke-linecap:round;opacity:.75}
.lz-mini{z-index:6;filter:drop-shadow(0 4px 5px rgba(75,42,111,.35))}
/* ================== PANEL / STAGE / DECOR (cream slide) ================ */
.scene{position:absolute;left:0;top:0;width:1400px;height:600px;
border-radius:0;z-index:0;overflow:hidden;background:none}
.scene::before{content:"";position:absolute;inset:0;
background-image:
radial-gradient(rgba(255,240,228,.16) 1.6px,transparent 1.7px),
radial-gradient(ellipse 250px 140px at 165px 55px,rgba(255,232,224,.38),rgba(255,232,224,0) 74%),
linear-gradient(112deg,rgba(255,255,255,0) 24%,rgba(255,236,226,.22) 46%,rgba(255,255,255,0) 66%),

.sst{position:absolute;width:30px;height:30px;background:#e6c76e;z-index:6;pointer-events:none;

@keyframes sstTw{0%,100%{opacity:.2;transform:scale(.6) rotate(0deg)}

/* --------------------- staggered entrance (8 children) ------------------ */
.mtxt>*{opacity:0;animation:up .8s ease-out forwards}
.txt>*:nth-child(1),.mtxt>*:nth-child(1){animation-delay:.12s}
.txt>*:nth-child(2),.mtxt>*:nth-child(2){animation-delay:.3s}
.txt>*:nth-child(3),.mtxt>*:nth-child(3){animation-delay:.48s}
.txt>*:nth-child(4),.mtxt>*:nth-child(4){animation-delay:.66s}
.txt>*:nth-child(5),.mtxt>*:nth-child(5){animation-delay:.84s}
.txt>*:nth-child(6),.mtxt>*:nth-child(6){animation-delay:1.1s}
.txt>*:nth-child(7),.mtxt>*:nth-child(7){animation-delay:1.3s}
.txt>*:nth-child(8),.mtxt>*:nth-child(8){animation-delay:1.5s}
.mtxt{display:none}

  box-shadow:0 1vw 3vw rgba(75,42,111,.12)}
  .mtxt .askr{gap:2vw;flex-wrap:wrap;justify-content:center}
  .mtxt .askh b{font-size:3.2vw}
  .mtxt .askh small{font-size:2.7vw}
  .mtxt .chip{font-size:2.6vw;padding:1.3vw 2.2vw;border-width:1.5px;margin-inline-start:-1.4vw}
  .mtxt .btns{margin-top:0;gap:1.8vw}

  .mtxt .btns .b1{width:auto;flex:1.15}

}
